# Production stack on the VPS: Postgres, a one-shot migration container, the Nuxt app and Caddy.
# deploy.sh runs it after each push to main that passes CI; README.md next to this file is the
# server runbook. Compose reads .env from this folder (names in .env.example).

name: kohvioad

# Docker's json-file log grows forever unless told otherwise. Every service gets the same cap,
# and Caddy masks client IPs, so no full IP address ends up in a log (§5).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    # Same image and volume layout as the dev docker-compose.yml.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Loopback only, for DBeaver through an SSH tunnel. Docker's iptables rules bypass host
      # firewalls, so a bare "5432:5432" would answer the whole internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Applies pending migrations and exits. The app starts only once this has exited with 0, so
  # it never runs on a schema that is behind its code. Also runs the seed (README.md).
  migrate:
    image: ghcr.io/ivom2k/coffeebeans:migrate-${IMAGE_TAG:?set by deploy.sh}
    restart: "no"
    environment:
      NUXT_DATABASE_URL: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  app:
    image: ghcr.io/ivom2k/coffeebeans:app-${IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: *database-url
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD in .env}
      # Keys the address hash stored with anonymous feedback. Required, so a server without it
      # stops the deploy at `docker compose pull` instead of running a site whose feedback fails.
      NUXT_IP_HMAC_KEY: ${NUXT_IP_HMAC_KEY:?set NUXT_IP_HMAC_KEY in .env}
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:?set NUXT_OAUTH_GOOGLE_CLIENT_ID in .env}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:?set NUXT_OAUTH_GOOGLE_CLIENT_SECRET in .env}
      # Fixed rather than built from the request, so it never depends on the headers Caddy
      # forwards. Must equal the prod client's redirect URI in Google Cloud Console.
      NUXT_OAUTH_GOOGLE_REDIRECT_URL: https://kohvioad.eu/api/auth/google
      # false until launch: robots.txt then disallows everything and every page says noindex.
      NUXT_SITE_INDEXABLE: ${NUXT_SITE_INDEXABLE:?set NUXT_SITE_INDEXABLE in .env}
      # Where the admin's photo uploads are written: the media volume below.
      NUXT_MEDIA_DIR: /app/media
      # Where uploads only the admin may see are written: the media_private volume below.
      NUXT_PRIVATE_MEDIA_DIR: /app/media-private
      # Lets the app take the visitor's address from the X-Forwarded-For header Caddy sets, for
      # the rate limiter. Only here: this app has no published port, so Caddy is the only thing
      # that can send it that header. Quoted, because Compose wants environment values as text.
      NUXT_TRUST_PROXY: "true"
    volumes:
      # Coffee photos. A named volume outlives the container, as the database's does, so a
      # redeploy keeps them. Caddy serves the same volume read-only at /media/.
      - media:/app/media
      # Suggestion photos until they are reviewed. Mounted here and nowhere else: Caddy has no
      # path to these files, so the only way to see one is the app's admin-only route.
      - media_private:/app/media-private
    # No published ports: only Caddy reaches the app, over the Compose network. That's what
    # makes the X-Forwarded-For header Caddy sets trustworthy (§5).
    #
    # Limits, because from Phase 7 on visitors' uploads are decoded here. The server has 2 GB
    # for this, Postgres and Caddy together.
    # mem_limit: the most RAM the container may use. Past it the kernel kills the Node process
    # (`docker inspect` then shows OOMKilled) and `restart: unless-stopped` starts it again,
    # instead of Postgres being pushed into swap or killed in its place. Node sizes its heap
    # from this limit. The app idles well under 300 MB; `docker stats --no-stream` shows it.
    mem_limit: 900m
    # pids_limit: the most processes and threads. Node, libuv and libvips use a few dozen; a
    # bug that spawns without end stops here instead of exhausting the server.
    pids_limit: 256
    # no-new-privileges: nothing in the container can gain rights it didn't start with, such as
    # through a setuid binary. The app runs as `node` and needs none.
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 runs over UDP
    volumes:
      # The folder, not the file: git checkout replaces the Caddyfile with a new file, and a
      # single-file mount would keep showing the old one.
      - ./caddy:/etc/caddy:ro
      # Certificates and the ACME account. Without them Caddy re-issues on every start and soon
      # hits Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config
      # Read-only: Caddy serves the photos the app writes and can't change them. The private
      # uploads' volume is deliberately not mounted here (a test checks it stays that way).
      - media:/srv/media:ro
    depends_on:
      - app
    logging: *logging

networks:
  default:
    # On an IPv4-only network, Docker's userland proxy takes IPv6 connections and forwards them
    # over IPv4, so Caddy would log the proxy's address instead of the visitor's.
    enable_ipv6: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  media:
  media_private:
