name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels the run still checking an older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Installs exactly what package-lock.json lists; its postinstall runs `nuxt prepare`.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
